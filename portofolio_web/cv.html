<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curriculum Vitae - Muhammad Alif</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="icon" href="data:,">

  <!-- CSS Utama & Tema (Terkoneksi) -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/aurora.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <!-- Prevent flash of wrong theme -->
  <script>
    (function () {
      var t = localStorage.getItem("porto-theme") ||
        (window.matchMedia("(prefers-color-scheme:light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>

  <style>
    /* CSS Spesifik CV */
    body {
      background-color: var(--bg-body);
      color: var(--text-primary);
      margin: 0;
      padding: 0;
      /* Dibiarkan tanpa overflow:hidden agar browser bisa scroll natural */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header layout - Lebih Jelas Pemisahnya */
    .cv-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--navbar-height, 70px);
      padding: 0 var(--space-6);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      /* Efek Glass Navbar */
      background: var(--bg-glass);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border-bottom: 1px solid var(--border-glass);
      box-shadow: var(--shadow-sm);
    }

    .cv-header__right {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    /* Tombol Navigasi */
    .btn-nav {
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-pill);
      font-size: var(--fs-sm);
      font-weight: var(--fw-semibold);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition-base);
    }

    .btn-outline {
      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
    }

    .btn-outline:hover {
      background: var(--accent);
      color: #fff;
      box-shadow: var(--neon-glow);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: 1px solid var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-hover, #6452df);
      box-shadow: var(--neon-glow);
      transform: translateY(-2px);
    }

    /* Kontainer Viewer */
    .cv-container {
      margin-top: calc(var(--navbar-height, 70px) + var(--space-6));
      margin-bottom: var(--space-8);
      margin-inline: auto;
      width: 100%;
      max-width: 820px;
      /* Diperkecil agar zoom normal layaknya A4 */
      padding: 0 var(--space-4);
      position: relative;
      z-index: 10;
    }

    .cv-wrapper {
      width: 100%;
      height: auto;
      background: #ffffff;
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      /* Ubah ke column agar multi-page tersusun ke bawah */
      justify-content: flex-start;
      align-items: center;
    }

    /* Mengamankan canvas agar maksimal merentang selebar pembungkus */
    .cv-wrapper canvas {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Memotong jarak kosong (margin putih) bawaan ukuran kertas PDF antar halaman */
    .cv-wrapper canvas+canvas {
      margin-top: -100px;
      /* Anda bisa memperbesar angka minus ini misal -70px jika dirasa masih kurang rapat */
    }

    @media (max-width: 768px) {
      .cv-header {
        padding: 0 var(--space-4);
      }

      .btn-nav-text {
        display: none;
      }

      .cv-container {
        padding: 0 var(--space-2);
        margin-top: calc(var(--navbar-height, 70px) + var(--space-4));
      }
    }
  </style>

  <!-- Load PDF.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>

  <!-- ═══ AURORA BACKGROUND (Sinkron dengan Tema Utama) ══════ -->
  <div class="aurora-bg" aria-hidden="true">
    <div class="aurora-blob aurora-blob--1"></div>
    <div class="aurora-blob aurora-blob--2"></div>
    <div class="aurora-blob aurora-blob--3"></div>
    <div class="aurora-blob aurora-blob--4"></div>
    <div class="aurora-blob aurora-blob--5"></div>
  </div>

  <!-- HEADER -->
  <header class="cv-header">
    <a href="index.html" class="btn-nav btn-outline">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="btn-nav-text">Kembali ke Portofolio</span>
    </a>

    <div class="cv-header__right">
      <a href="assets/CV/cv.pdf" download id="download-raw-cv" class="btn-nav btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span class="btn-nav-text">Unduh / Cetak PDF</span>
      </a>
    </div>
  </header>

  <!-- PDF VIEWER CONTAINER -->
  <main class="cv-container">
    <div class="cv-wrapper">
      <!-- Kanvas HTML tempat PDF.js akan melukis dokumen CV (Generate via JS) -->
    </div>
  </main>

  <!-- Script Eksekusi PDF.js -->
  <script>
    const url = 'assets/CV/cv.pdf';

    // Konfigurasi letak Web Worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const cvWrapper = document.querySelector('.cv-wrapper');

    // Muat dokumen
    pdfjsLib.getDocument(url).promise.then(async (pdfDoc) => {
      const numPages = pdfDoc.numPages;
      const initialWrapperWidth = Math.max(cvWrapper.clientWidth, 800); // Base minimum scaling

      // Render setiap halaman berurutan ke bawah
      for (let pageNum = 1; pageNum <= numPages; pageNum++) {
        const page = await pdfDoc.getPage(pageNum);
        const viewportBawaan = page.getViewport({ scale: 1.0 });

        // Kalkulasi Skala resolusi (Supaya tidak blur di layar HD)
        const scaleYangDibutuhkan = (initialWrapperWidth / viewportBawaan.width) * 2;
        const viewportHighRes = page.getViewport({ scale: scaleYangDibutuhkan });

        // Buat elemen canvas per halaman
        const canvas = document.createElement('canvas');
        canvas.height = viewportHighRes.height;
        canvas.width = viewportHighRes.width;
        // Pemotongan jarak dan garis pemisah sekarang sepenuhnya dihandle oleh CSS (margin-top)

        const ctx = canvas.getContext('2d');
        const renderCtx = {
          canvasContext: ctx,
          viewport: viewportHighRes
        };

        cvWrapper.appendChild(canvas);
        await page.render(renderCtx).promise;
      }
    }).catch(err => {
      console.error('Kesalahan saat merender PDF menggunakan PDF.js', err);
      // Tampilkan error secara langsung jika gagal
      cvWrapper.innerHTML = '<div style="padding:4rem 2rem; color: #ff5252; text-align:center;"><h4>File PDF gagal diakses.</h4><p>Pastikan Anda membuka website ini melalui Local Server (Live Server).</p><a href="' + url + '" style="color:var(--accent);">Unduh PDF disini</a></div>';
    });
  </script>

</body>

</html>
